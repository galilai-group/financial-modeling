<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Challenge leaderboard</title><link rel="stylesheet" href="style.css">
<script src="leaderboard.js" defer></script></head><body><main>
<p class="eyebrow">RESEARCH CHALLENGE</p>
<div class="topline"><h1 id="title">Leaderboard</h1><a id="submit" class="button" hidden>Submit checkpoint</a></div>
<p id="description"></p><p class="muted" id="details"></p>
<section class="card"><div class="topline"><h2>Leaderboard</h2>
<input type="search" id="search" aria-label="Find a participant" placeholder="Find participant…"></div>
<p class="muted" id="policy"></p><div class="table-wrap"><table>
<thead><tr><th scope="col">Rank</th><th scope="col">Participant</th><th scope="col" id="metric">Score</th><th scope="col">Submitted</th></tr></thead>
<tbody id="rows"></tbody></table></div><p id="status" role="status">Loading scores…</p></section>
<p class="muted">Email addresses and checkpoints are private. Scores update after the organizers run evaluation.</p>
</main></body></html>
